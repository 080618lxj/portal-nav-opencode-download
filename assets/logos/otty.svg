<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 90 420 432" width="420" height="432">
  <defs>
    <!-- Base sphere color -->
    <radialGradient id="sphereGrad" cx="0.35" cy="0.32" r="0.62" fx="0.30" fy="0.28">
      <stop offset="0%" stop-color="#525258"/>
      <stop offset="70%" stop-color="#48484f"/>
      <stop offset="100%" stop-color="#404046"/>
    </radialGradient>
    <!-- Light hitting upper-left, matte/charcoal diffuse spread -->
    <radialGradient id="highlight" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow on bottom-right, gentle -->
    <radialGradient id="shadowGrad" cx="0.72" cy="0.78" r="0.7">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Drop shadow under sphere -->
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Sphere base -->
  <circle cx="300" cy="300" r="210" fill="url(#sphereGrad)" filter="url(#dropShadow)"/>
  <!-- Texture -->
  <circle cx="300" cy="300" r="210" fill="url(#sphereGrad)" filter="url(#noise)" opacity="0.3"/>
  <!-- Light on upper-left -->
  <circle cx="300" cy="300" r="210" fill="url(#highlight)"/>
  <!-- Shadow on bottom-right -->
  <circle cx="300" cy="300" r="210" fill="url(#shadowGrad)"/>

  <!-- Face looking upper-left, rotated 9deg clockwise -->
  <g fill="none" stroke="#e8e6e0" stroke-linecap="round" stroke-linejoin="round" transform="rotate(9, 237, 272)">
    <!-- Left eye > -->
    <polyline points="152,224 187,256 152,288" stroke-width="20"/>
    <!-- Right eye * (spins while a session is working) -->
    <g stroke="#e8e6e0" stroke-width="18" stroke-linecap="round">
      <line x1="311" y1="226" x2="311" y2="286"/>
      <line x1="286" y1="241" x2="336" y2="271"/>
      <line x1="336" y1="241" x2="286" y2="271"/>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 311 256" to="360 311 256" dur="2s" repeatCount="indefinite"/>
    </g>
    <!-- Mouth _ -->
    <line x1="206" y1="334" x2="268" y2="334" stroke-width="20"/>
  </g>
</svg>
